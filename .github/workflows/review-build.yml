name: Private review build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Astro project
        run: npm run check
      - name: Build static review
        run: npm run build
      - name: Upload private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: digitalforces-website-review
          path: dist/
          if-no-files-found: error
          retention-days: 14
